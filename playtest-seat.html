<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Seat</title>
  </head>
  <body style="background: #141916">
    <!-- Dev only (playtest.html): takes one player's session from the URL, then opens the app as that player. -->
    <script>
      const params = new URLSearchParams(location.hash.slice(1));
      sessionStorage.setItem("imposter.session.v1", params.get("session"));
      // Only one phone plays sound, or every shared sound plays seven times.
      // The table then hands sound to whichever phone you bring up.
      localStorage.setItem("imposter.sound", params.get("sound") === "on" ? "on" : "off");
      location.replace("/");
    </script>
  </body>
</html>
